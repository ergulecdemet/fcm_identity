name: fcm_identity
description: >-
  OneSignal-style push notifications on top of Firebase Cloud Messaging.
  login/logout users, sync device tokens to your own backend, handle taps
  and foreground notifications with a few lines of code.
version: 0.1.0
homepage: https://github.com/ergulecdemet/fcm_identity
repository: https://github.com/ergulecdemet/fcm_identity
issue_tracker: https://github.com/ergulecdemet/fcm_identity/issues
topics:
  - push-notifications
  - firebase
  - fcm
  - notifications
  - onesignal

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
